<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Girasoles para ustedes 🌻</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky">
      <div class="stars"></div>
      <div class="message">
        <span class="sparkle">✦</span>
        <h1>Para que mis amigas casi ingenieras 🌻</h1>
        <p>
          Que siempre haya un poquito de sol para ustedes y Que no sean
          espectadoras ✨
        </p>
      </div>

      <div class="garden" id="garden">
        <div class="sunflower" style="--x: 8%; --delay: 0s; --size: 1">
          <div class="flower">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"><span></span><span></span></div>
        </div>

        <div class="sunflower" style="--x: 27%; --delay: 0.8s; --size: 0.85">
          <div class="flower">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"><span></span><span></span></div>
        </div>

        <div
          class="sunflower main"
          style="--x: 50%; --delay: 0.25s; --size: 1.15"
        >
          <div class="flower">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"><span></span><span></span></div>
        </div>

        <div class="sunflower" style="--x: 73%; --delay: 1.1s; --size: 0.9">
          <div class="flower">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"><span></span><span></span></div>
        </div>

        <div class="sunflower" style="--x: 91%; --delay: 0.55s; --size: 0.78">
          <div class="flower">
            <div class="petals"></div>
            <div class="center"></div>
          </div>
          <div class="stem"><span></span><span></span></div>
        </div>
      </div>

      <button id="surprise">Toca aquí 🌻</button>
      <div id="hearts"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
